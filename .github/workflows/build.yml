---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * 0'  # 10:05am UTC (5:05am EST) every Sunday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      handwritten:
        description: "Optional handwritten notes to prepend to the release changelog"
        required: false
        default: ""
        type: string

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  build_push:
    name: Build and push ${{ matrix.variant }}
    runs-on: ubuntu-26.04
    # Build the standard and nvidia variants as independent matrix entries so
    # each gets its own date-indexed tag series (45-* vs 45-nvidia-*), SBOM,
    # signature, and pushed tags. fail-fast is off so one variant failing
    # still lets the other finish.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            build_recipe: build
            tag_suffix: ""
          - variant: nvidia
            build_recipe: build-nvidia
            tag_suffix: "-nvidia"
    # Per-variant concurrency: two builds of the same variant don't overlap,
    # but standard and nvidia can build in parallel.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ matrix.variant }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # actions/checkout leaves git-lfs POINTER files in the working tree —
      # it does not fetch the blobs. Pull the real vendored_rpms/*.rpm here,
      # before the build (which fails loudly if pointers are present). Done
      # before remove-unwanted-software in case that action strips git-lfs.
      - name: Fetch Git LFS objects
        run: |
          git lfs install
          git lfs pull

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          # The tag this variant is pushed under. `build-nvidia` tags the image
          # <tag>-nvidia, so every downstream step for the nvidia variant keys
          # off <tag>-nvidia, not <tag>.
          echo "PUSH_TAG=${DEFAULT_TAG}${{ matrix.tag_suffix }}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just ${{ matrix.build_recipe }} \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${PUSH_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      # `just generate-build-tags` queries GHCR for the next date-indexed tag
      # (<tag>-YYYYMMDD.N) via `skopeo list-tags` — used by the release
      # changelog in .github/changelogs.py
      - name: Ensure skopeo
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo
          fi

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${PUSH_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${PUSH_TAG}" \
            "${ALIAS_TAGS}"

      # Generate an SPDX SBOM of the final (rechunked) image so it can be
      # attached to the pushed image below; the release job diffs the two
      # newest SBOMs to build the changelog (see .github/changelogs.py)
      - name: Setup Syft
        id: setup-syft
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SBOM
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          set -euox pipefail
          just gen-sbom \
            ${IMAGE_NAME} \
            ${PUSH_TAG} \
            "${SYFT_CMD}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Install ORAS
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      # Attach the SBOM to the pushed image as an OCI artifact referrer, so
      # the release job can diff it against the previous build's SBOM
      - name: Login to GHCR with ORAS
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          oras login ghcr.io -u "${GITHUB_ACTOR}" -p "${GITHUB_TOKEN}"

      - name: Attach SBOM
        id: attach-sbom
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euox pipefail
          just attach-sbom \
            ${IMAGE_NAME} \
            ${PUSH_TAG} \
            --registry "${IMAGE_REGISTRY}" \
            --digest "${DIGEST}"
          sbom_digest=$(< /tmp/sbom-digestfile)
          echo "sbom_digest=${sbom_digest}" >> $GITHUB_OUTPUT

      - name: Sign SBOM OCI Artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SBOM_DIGEST: ${{ steps.attach-sbom.outputs.sbom_digest }}
        run: |
          set -euox pipefail
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${SBOM_DIGEST}

  # After a published build, diff the SBOMs of the two newest date-indexed
  # tags (<tag>-YYYYMMDD.N) and open a GitHub Release with the changes
  # (see .github/changelogs.py). Matrixed per variant so each stream gets its
  # own release (45-* and 45-nvidia-*).
  generate-release:
    name: Generate release (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    needs: [build_push]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tag_suffix: ""
          - variant: nvidia
            tag_suffix: "-nvidia"
    permissions:
      contents: write
    steps:
      # Full history is needed so `git log` can list the commits between the
      # two builds (the OCI image revision label carries the commit hashes)
      - name: Checkout last 500 commits (for <commits> to work)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 500

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Ensure skopeo and zstd
        run: |
          missing=()
          for tool in skopeo zstd; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${missing[@]}"
          fi

      - name: Default Tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          echo "PUSH_TAG=${DEFAULT_TAG}${{ matrix.tag_suffix }}" >> ${GITHUB_ENV}

      - name: Generate release text
        id: generate-release-text
        env:
          HANDWRITTEN: ${{ inputs.handwritten }}
        run: |
          set -euox pipefail
          just changelogs "${HANDWRITTEN}" "${PUSH_TAG}"
          source ./output.env
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.generate-release-text.outputs.title }}
          TAG: ${{ steps.generate-release-text.outputs.tag }}
        run: |
          set -euox pipefail
          # No --latest: with two variants (standard + nvidia) only one release
          # could be "latest", so let GitHub auto-pick the most recent instead.
          gh release create \
            "${TAG}" \
            --title "${TITLE}" \
            -F ./changelog.md
