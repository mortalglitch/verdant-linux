config_version = 15

[accessibility]
ui_scale = 1.2000000104308128

[bar.default]
background_opacity = 0.92
center = [ "clock", "notifications", "media" ]
end = [ "tray", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]
margin_edge = 2
radius = 30
start = [ "launcher", "keys", "wallpaper", "workspaces" ]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[plugin_settings."linux-fertxo/hyprland-visual-editor"]
is_system_active = true

[plugins]
enabled = [ "mortalglitch/keymap" ]

[shell]
font_family = "Caladea"
settings_window_translucent = true
telemetry_enabled = false

    [shell.panel]
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

[theme]
builtin = "Tokyo-Night"
community_palette = "Osaka jade"
custom_palette = "VerdantBrutalistTheme"
mode = "light"
source = "custom"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "umbriel" ]
    community_ids = [ "lazyvim" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/star-trails-light.png"

[widget.clock]
format = "{:%A} - {:%B - %d} - {:%H:%M}"

[widget.control-center]
glyph = "leaf-2"

[widget.keys]
type = "mortalglitch/keymap:keys"

[widget.workspaces]
hide_when_empty = true
