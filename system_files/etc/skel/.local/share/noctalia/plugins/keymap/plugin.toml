# Noctalia plugin — Keymap
# Live list of the user's compositor (Hyprland or Umbriel) + Noctalia
# shortcuts with a search bar. Detects the running compositor on open.
id = "mortalglitch/keymap"
name = "Keymap"
version = "1.2.0"
plugin_api = 24
author = "mortalglitch"

# Bar widget: keyboard glyph that opens the keymap panel.
[[widget]]
id = "keys"
entry = "widget.luau"

# The panel itself. Floating, centered, takes keyboard focus so you can type
# in the search box immediately.
[[panel]]
id = "keymap"
entry = "panel.luau"
width = 480
height = 640
placement = "floating"
position = "center"
keyboard_focus = "exclusive"

# Headless IPC target for the Mod+K keybind: `noctalia msg plugin
# mortalglitch/keymap:service all toggle` toggles the panel in-process
# (the CLI `panel-toggle` route reports "unknown panel" for plugin panels).
[[service]]
id = "service"
entry = "service.luau"
