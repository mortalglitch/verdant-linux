# Declarative Distrobox definitions (same pattern as Bazzite/Bluefin).
# Create them all at once with:
#   distrobox assemble create --replace --file /etc/distrobox/distrobox.ini
# or pick individual ones in the DistroShelf GUI.
# Add more distros by appending sections; see
# https://distrobox.privatedns.org/usage/distrobox-assemble/
# Tip: use additional_packages for declarative preinstalled packages, e.g.
#   additional_packages=git curl
[ubuntu]
image=ghcr.io/ublue-os/ubuntu-toolbox:latest
pull=true

[fedora]
image=ghcr.io/ublue-os/fedora-toolbox:latest
pull=true

[wolfi]
image=ghcr.io/ublue-os/wolfi-toolbox
pull=true
